<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211633">
<title>花花的星海信箱</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
 --bg:#f7f1ff;--card:#fff;--text:#352547;--muted:#83758f;
 --primary:#9670d3;--primary2:#6d4ba8;--soft:#eee4ff;
 --line:#e8dcf6;--shadow:0 12px 35px #49316a12
}
body.dark{
 --bg:#15111e;--card:#211a2e;--text:#f5edff;--muted:#b8a9c8;
 --primary:#b69ae8;--primary2:#d1b8ff;--soft:#332743;
 --line:#443451;--shadow:0 12px 35px #0003
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 transition:background .25s;color .25s}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.hero{position:relative;overflow:hidden;text-align:center;padding:42px 16px 35px;
 background:linear-gradient(135deg,#201633,#514075,#9276c9);color:#fff}
.hero:before,.hero:after{content:"✦  ·  ✧    ·    ✦  ·  ✧";
 position:absolute;opacity:.35;letter-spacing:12px;font-size:20px;left:0;right:0}
.hero:before{top:15px}.hero:after{bottom:12px}
.hero h1{font-size:clamp(25px,6vw,38px);margin:10px 0}
.hero p{margin:8px auto;max-width:500px;line-height:1.8}
.hero .tag{font-size:12px;letter-spacing:3px;opacity:.8}
.top-actions{position:absolute;right:12px;top:12px;z-index:2}
.top-actions button{width:auto;padding:8px 12px;background:#ffffff20;
 border:1px solid #ffffff50}
main{max-width:850px;margin:22px auto;padding:0 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;
 padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{font-size:19px;margin:0 0 14px}
.muted{color:var(--muted);font-size:13px;line-height:1.7}
label{display:block;font-size:13px;margin:12px 0 5px;color:var(--muted)}
input:not([type=checkbox]):not([type=file]),textarea,select{
 width:100%;padding:12px 13px;border:1px solid var(--line);
 background:var(--bg);color:var(--text);border-radius:12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{min-height:100px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 16px;
 background:var(--primary);color:white;font-weight:650}
.btn:hover{filter:brightness(1.04)}
.btn.secondary{background:var(--soft);color:var(--text)}
.btn.danger{background:#b64e68}
.btn.full{width:100%;margin-top:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btnrow .btn{flex:1}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.hidden{display:none!important}
.notice{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;
 padding:12px;border-radius:12px;background:var(--soft);margin:12px 0}
.notice.error{background:#ffe9ee;color:#8e2741}
.notice.ok{background:#e4f8ec;color:#226941}
.box-item,.message,.reply{border:1px solid var(--line);border-radius:15px;
 padding:15px;margin:12px 0;background:var(--card);overflow-wrap:anywhere}
.box-item h3{margin:0 0 8px}
.box-item p,.message p,.reply p{line-height:1.8;white-space:pre-wrap}
.box-meta{font-size:12px;color:var(--muted)}
.message{background:var(--soft)}
.message img{max-width:100%;max-height:400px;object-fit:contain;border-radius:12px}
.message-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.reply{margin-left:12px;padding:12px;background:var(--bg)}
.pill{display:inline-block;padding:4px 9px;border-radius:20px;
 background:var(--soft);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:24px 8px;line-height:2}
footer{text-align:center;padding:10px 20px 32px;color:var(--muted);font-size:12px}
.checkline{display:flex;align-items:center;gap:8px;margin:12px 0}
.checkline input{width:18px;height:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:540px){
 .hero{padding-top:55px}
 .card{padding:16px;border-radius:16px}
 .grid{grid-template-columns:1fr}
 .btnrow{flex-direction:column}
 .btnrow .btn{width:100%}
}
</style>
</head>
<body>
<header class="hero">
 <div class="top-actions"><button class="btn" id="themeBtn">☾ 主题</button></div>
 <div class="tag">HUA CHEN YU · STAR LETTERS</div>
 <h1>🌌 花花的星海信箱</h1>
 <p>把想说的话，寄往星光所在的地方。</p>
 <p class="tag">愿每一份心意，都能在星海中被看见。</p>
</header>
<main>
 <div id="notice" class="notice hidden" role="status" aria-live="polite"></div>
 <section class="card" id="authPanel">
  <h2>✦ 来自星海的访客</h2>
  <p class="muted">注册或登录后管理自己的留言箱。请使用可以接收验证邮件的邮箱。</p>
  <label for="email">邮箱</label>
  <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
  <label for="password">密码</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="至少 6 位">
  <div class="btnrow">
   <button class="btn" id="registerBtn">创建账号</button>
   <button class="btn secondary" id="loginBtn">登录</button>
  </div>
 </section>
 <section class="card hidden" id="accountPanel">
  <h2>✦ 我的星海</h2>
  <p id="accountLabel" class="muted"></p>
  <div class="btnrow">
   <button class="btn secondary" id="refreshBtn">刷新</button>
   <button class="btn secondary" id="logoutBtn">退出登录</button>
  </div>
 </section>
 <section class="card hidden" id="createPanel">
  <h2>✦ 创建自己的留言箱</h2>
  <label for="boxTitle">留言箱名称</label>
  <input id="boxTitle" maxlength="100" placeholder="例如：花花的星海信箱">
  <label for="boxDescription">留言箱介绍</label>
  <textarea id="boxDescription" maxlength="1000" placeholder="写一段介绍，让来访的人知道这里是什么地方……"></textarea>
  <label for="boxTheme">星海主题</label>
  <select id="boxTheme">
   <option value="huachen">华晨宇 · 星海紫</option>
   <option value="moon">月光银</option>
   <option value="dream">梦境粉</option>
  </select>
  <button class="btn full" id="createBoxBtn">✨ 创建留言箱</button>
  <p class="muted">创建成功后，留言箱会出现在下方。当前版本按现有 owner_id 权限管理留言箱。</p>
 </section>
 <section class="card hidden" id="boxesPanel">
  <h2>✦ 我的留言箱</h2>
  <div id="boxesList"><div class="empty">正在寻找星海……</div></div>
 </section>
 <section class="card hidden" id="detailPanel">
  <button class="btn secondary" id="backBtn">← 返回留言箱列表</button>
  <hr>
  <h2 id="detailTitle">星海留言</h2>
  <p id="detailDescription" class="muted"></p>
  <div class="pill" id="detailSlug"></div>
  <hr>
  <h2>✉️ 写下一封信</h2>
  <label for="nickname">留言昵称</label>
  <input id="nickname" maxlength="40" placeholder="星友">
  <label class="checkline"><input id="anonymous" type="checkbox" checked> 匿名留言</label>
  <label for="messageContent">留言内容</label>
  <textarea id="messageContent" maxlength="5000" placeholder="想说的话，都可以写在这里……"></textarea>
  <label for="imageFile">附上一张图片（可选，最大 5 MB）</label>
  <input id="imageFile" type="file" accept="image/*">
  <button class="btn full" id="sendBtn">将信寄往星海</button>
  <hr>
  <h2>💫 留言星河</h2>
  <div id="messagesList"><div class="empty">加载留言中……</div></div>
 </section>
</main>
<footer>花晨月夕，星海有信。<br>非官方粉丝交流页面。</footer>
<script>
(() => {
"use strict";
const SUPABASE_URL = "https://aerhvafsvrfvazhfczwp.supabase.co";
const SUPABASE_KEY = "sb_publishable_cZQ01zJYmuQnM44wepgmow_fgJcNoy-";
const BUCKET = "message-images";
const $ = id => document.getElementById(id);
let db = null;
let user = null;
let currentBox = null;
let boxes = [];
let busy = false;
function notify(message, type = "") {
 const el = $("notice");
 el.textContent = message;
 el.className = "notice" + (type ? " " + type : "");
 el.classList.remove("hidden");
}
function clearNotice() {
 $("notice").classList.add("hidden");
}
function setBusy(value) {
 busy = value;
 document.querySelectorAll("button").forEach(b => {
  if (!b.dataset.noBusy) b.disabled = value;
 });
}
function errorText(error) {
 if (!error) return "未知错误";
 return [error.message, error.details, error.hint, error.code]
  .filter(Boolean).join("\n");
}
function explainError(error, operation) {
 const msg = errorText(error);
 if (/Invalid path specified in request URL/i.test(msg)) {
  return operation + "失败：请求路径无效。\n请确认 SDK 地址、Supabase Project URL 和请求表名。";
 }
 if (/row-level security|permission denied|42501/i.test(msg)) {
  return operation + "失败：数据库权限策略拒绝了请求。\n请保留现有安全策略，并检查当前用户是否有对应权限。\n" + msg;
 }
 if (/schema cache|could not find the table|PGRST205|PGRST204/i.test(msg)) {
  return operation + "失败：Supabase Data API 未识别该表或字段。\n检查表是否已启用 Data API 访问权限。\n" + msg;
 }
 return operation + "失败：\n" + msg;
}
function setLoggedIn(nextUser) {
 user = nextUser || null;
 $("authPanel").classList.toggle("hidden", !!user);
 $("accountPanel").classList.toggle("hidden", !user);
 $("createPanel").classList.toggle("hidden", !user);
 $("boxesPanel").classList.toggle("hidden", !user);
 $("detailPanel").classList.add("hidden");
 $("accountLabel").textContent = user ? "已登录：" + user.email : "";
 currentBox = null;
}
function slugify() {
 return "star-" + crypto.randomUUID().replaceAll("-", "").slice(0,16);
}
async function register() {
 const email = $("email").value.trim();
 const password = $("password").value;
 if (!email || password.length < 6) {
  notify("请填写有效邮箱和至少 6 位密码。", "error"); return;
 }
 setBusy(true);
 try {
  const {data,error} = await db.auth.signUp({email,password});
  if (error) throw error;
  if (data.session) {
   setLoggedIn(data.user);
   notify("注册成功，欢迎来到星海！", "ok");
   await loadBoxes();
  } else {
   notify("注册请求已提交。请检查邮箱，完成验证后再登录。", "ok");
  }
 } catch(e) {
  notify(explainError(e,"注册"), "error");
 } finally { setBusy(false); }
}
async function login() {
 const email = $("email").value.trim();
 const password = $("password").value;
 if (!email || !password) {
  notify("请填写邮箱和密码。","error"); return;
 }
 setBusy(true);
 try {
  const {data,error} = await db.auth.signInWithPassword({email,password});
  if (error) throw error;
  setLoggedIn(data.user);
  notify("登录成功！","ok");
  await loadBoxes();
 } catch(e) {
  notify(explainError(e,"登录"),"error");
 } finally { setBusy(false); }
}
async function logout() {
 setBusy(true);
 try {
  const {error} = await db.auth.signOut();
  if (error) throw error;
  setLoggedIn(null);
  $("boxesList").replaceChildren();
  notify("已安全退出。","ok");
 } catch(e) {
  notify(explainError(e,"退出登录"),"error");
 } finally { setBusy(false); }
}
async function loadBoxes() {
 if (!user) return;
 $("boxesList").textContent = "正在加载留言箱……";
 try {
  const {data,error} = await db.from("boxes")
   .select("id,owner_id,slug,title,description,theme,created_at")
   .order("created_at",{ascending:false});
  if (error) throw error;
  boxes = data || [];
  renderBoxes();
 } catch(e) {
  $("boxesList").textContent = "";
  notify(explainError(e,"加载留言箱"),"error");
 }
}
function renderBoxes() {
 const root = $("boxesList");
 root.replaceChildren();
 if (!boxes.length) {
  const empty = document.createElement("div");
  empty.className = "empty";
  empty.textContent = "这里还没有留言箱。\n创建你的第一个星海留言箱吧 ✨";
  root.appendChild(empty);
  return;
 }
 for (const box of boxes) {
  const article = document.createElement("article");
  article.className = "box-item";
  const h = document.createElement("h3");
  h.textContent = "🌌 " + box.title;
  const p = document.createElement("p");
  p.textContent = box.description || "把想说的话，寄往星光所在的地方。";
  const meta = document.createElement("div");
  meta.className = "box-meta";
  meta.textContent = "主题：" + box.theme + " · " +
   new Date(box.created_at).toLocaleString();
  const btn = document.createElement("button");
  btn.className = "btn full";
  btn.textContent = "打开留言箱";
  btn.addEventListener("click",() => openBox(box));
  article.append(h,p,meta,btn);
  root.appendChild(article);
 }
}
async function createBox() {
 const title = $("boxTitle").value.trim();
 const description = $("boxDescription").value.trim();
 const theme = $("boxTheme").value;
 if (!title) {
  notify("请先填写留言箱名称。","error"); return;
 }
 setBusy(true);
 try {
  const record = {
   owner_id:user.id,
   slug:slugify(),
   title,
   description:description || "把想说的话，寄往星光所在的地方。",
   theme
  };
  const {data,error} = await db.from("boxes")
   .insert(record).select("*").single();
  if (error) throw error;
  $("boxTitle").value = "";
  $("boxDescription").value = "";
  notify("留言箱创建成功！","ok");
  await loadBoxes();
  if (data) openBox(data);
 } catch(e) {
  notify(explainError(e,"创建留言箱"),"error");
 } finally { setBusy(false); }
}
async function openBox(box) {
 currentBox = box;
 $("detailTitle").textContent = box.title;
 $("detailDescription").textContent = box.description || "";
 $("detailSlug").textContent = "链接标识：" + box.slug;
 $("detailPanel").classList.remove("hidden");
 $("boxesPanel").classList.add("hidden");
 await loadMessages();
 window.scrollTo({top:$("detailPanel").offsetTop - 12,behavior:"smooth"});
}
async function loadMessages() {
 if (!currentBox) return;
 const root = $("messagesList");
 root.textContent = "正在读取留言……";
 try {
  const {data,error} = await db.from("messages")
   .select("id,box_id,nickname,anonymous,content,image_path,created_at")
   .eq("box_id",currentBox.id)
   .order("created_at",{ascending:false})
   .limit(100);
  if (error) throw error;
  root.replaceChildren();
  if (!data || !data.length) {
   const empty = document.createElement("div");
   empty.className = "empty";
   empty.textContent = "星海暂时很安静。\n成为第一个寄出心意的人吧。";
   root.appendChild(empty);
   return;
  }
  for (const message of data) {
   const article = document.createElement("article");
   article.className = "message";
   const head = document.createElement("div");
   head.className = "message-head";
   const name = document.createElement("strong");
   name.textContent = message.anonymous ? "匿名星友" : (message.nickname || "星友");
   const date = document.createElement("span");
   date.className = "box-meta";
   date.textContent = new Date(message.created_at).toLocaleString();
   head.append(name,date);
   const content = document.createElement("p");
   content.textContent = message.content;
   article.append(head,content);
   if (message.image_path) {
    const img = document.createElement("img");
    img.alt = "留言图片";
    img.loading = "lazy";
    img.src = await imageUrl(message.image_path);
    article.appendChild(img);
   }
   const repliesRoot = document.createElement("div");
   repliesRoot.className = "replies";
   article.appendChild(repliesRoot);
   const replyBtn = document.createElement("button");
   replyBtn.className = "btn secondary";
   replyBtn.textContent = "查看回复";
   replyBtn.addEventListener("click",() => loadReplies(message,repliesRoot));
   article.appendChild(replyBtn);
   if (currentBox.owner_id === user.id) {
    const replyInput = document.createElement("textarea");
    replyInput.placeholder = "作为留言箱主人，回复这封信……";
    replyInput.maxLength = 3000;
    const replySend = document.createElement("button");
    replySend.className = "btn";
    replySend.textContent = "发送回复";
    replySend.addEventListener("click",() => sendReply(message,replyInput));
    article.append(replyInput,replySend);
   }
   root.appendChild(article);
  }
 } catch(e) {
  root.textContent = "";
  notify(explainError(e,"加载留言"),"error");
 }
}
async function imageUrl(path) {
 if (/^https?:\/\//i.test(path)) return path;
 const {data,error} = await db.storage.from(BUCKET).createSignedUrl(path,3600);
 if (!error && data?.signedUrl) return data.signedUrl;
 const {data:publicData} = db.storage.from(BUCKET).getPublicUrl(path);
 return publicData?.publicUrl || "";
}
async function sendMessage() {
 if (!currentBox) return;
 const content = $("messageContent").value.trim();
 if (!content) {
  notify("请先写下留言内容。","error"); return;
 }
 const file = $("imageFile").files[0];
 if (file && !file.type.startsWith("image/")) {
  notify("请选择图片文件。","error"); return;
 }
 if (file && file.size > 5*1024*1024) {
  notify("图片不能超过 5 MB。","error"); return;
 }
 setBusy(true);
 try {
  let imagePath = null;
  if (file) {
   const ext = (file.name.split(".").pop() || "jpg").replace(/[^a-z0-9]/gi,"");
   const path = "messages/" + crypto.randomUUID() + "." + ext;
   const {data,error} = await db.storage.from(BUCKET)
    .upload(path,file,{upsert:false,contentType:file.type});
   if (error) throw error;
   imagePath = data.path;
  }
  const record = {
   box_id:currentBox.id,
   nickname:$("anonymous").checked ? "匿名访客" :
    ($("nickname").value.trim() || "星友"),
   anonymous:$("anonymous").checked,
   content,
   image_path:imagePath
  };
  const {error} = await db.from("messages").insert(record);
  if (error) throw error;
  $("messageContent").value = "";
  $("imageFile").value = "";
  notify("留言已寄出！愿你的心意被星光收藏。","ok");
  await loadMessages();
 } catch(e) {
  notify(explainError(e,"发送留言"),"error");
 } finally { setBusy(false); }
}
async function loadReplies(message,root) {
 root.textContent = "正在加载回复……";
 try {
  const {data,error} = await db.from("replies")
   .select("id,box_id,message_id,content,created_at")
   .eq("message_id",message.id)
   .order("created_at",{ascending:true});
  if (error) throw error;
  root.replaceChildren();
  if (!data || !data.length) {
   const empty = document.createElement("p");
   empty.className = "muted";
   empty.textContent = "这封信还没有回复。";
   root.appendChild(empty);
   return;
  }
  for (const reply of data) {
   const div = document.createElement("div");
   div.className = "reply";
   const p = document.createElement("p");
   p.textContent = reply.content;
   const time = document.createElement("div");
   time.className = "box-meta";
   time.textContent = new Date(reply.created_at).toLocaleString();
   div.append(p,time);
   root.appendChild(div);
  }
 } catch(e) {
  root.textContent = "";
  notify(explainError(e,"加载回复"),"error");
 }
}
async function sendReply(message,input) {
 const content = input.value.trim();
 if (!content) {
  notify("请先填写回复内容。","error"); return;
 }
 if (!currentBox || currentBox.owner_id !== user.id) {
  notify("只有留言箱主人可以在此处回复。","error"); return;
 }
 setBusy(true);
 try {
  const {error} = await db.from("replies").insert({
   box_id:currentBox.id,
   message_id:message.id,
   content
  });
  if (error) throw error;
  input.value = "";
  notify("回复发送成功！","ok");
  const article = input.closest(".message");
  const root = article.querySelector(".replies");
  await loadReplies(message,root);
 } catch(e) {
  notify(explainError(e,"发送回复"),"error");
 } finally { setBusy(false); }
}
$("themeBtn").addEventListener("click",() => {
 document.body.classList.toggle("dark");
});
$("registerBtn").addEventListener("click",register);
$("loginBtn").addEventListener("click",login);
$("logoutBtn").addEventListener("click",logout);
$("createBoxBtn").addEventListener("click",createBox);
$("sendBtn").addEventListener("click",sendMessage);
$("refreshBtn").addEventListener("click",loadBoxes);
$("backBtn").addEventListener("click",() => {
 currentBox = null;
 $("detailPanel").classList.add("hidden");
 $("boxesPanel").classList.remove("hidden");
});
async function start() {
 if (!window.supabase?.createClient) {
  notify("Supabase SDK 加载失败。请检查网络或 CDN 是否可访问。","error");
  return;
 }
 if (SUPABASE_KEY.startsWith("在这里")) {
  notify("请先填写 Supabase Publishable Key。","error");
  return;
 }
 try {
  new URL(SUPABASE_URL);
  db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data,error} = await db.auth.getSession();
  if (error) throw error;
  setLoggedIn(data.session?.user || null);
  if (user) await loadBoxes();
  db.auth.onAuthStateChange((_event,session) => {
   setLoggedIn(session?.user || null);
  });
 } catch(e) {
  notify(explainError(e,"初始化"),"error");
 }
}
start();
})();
</script>
