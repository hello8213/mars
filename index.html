<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211633">
<title>花花的星海信箱</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #171020;
  --card: #241932;
  --card2: #30203f;
  --text: #f8f0ff;
  --muted: #bca9cb;
  --accent: #d5a7ff;
  --border: #493457;
  --danger: #ff8caa;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(ellipse at top, #352044, var(--bg) 70%);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  min-height: 100vh;
}
button, input, textarea, select { font: inherit; }
button {
  border: 0;
  border-radius: 12px;
  padding: 10px 14px;
  background: var(--accent);
  color: #281634;
  font-weight: 700;
  cursor: pointer;
}
button:disabled { opacity: .5; cursor: not-allowed; }
button.secondary {
  background: var(--card2);
  color: var(--text);
  border: 1px solid var(--border);
}
button.danger { background: #5b293e; color: #ffe2eb; }
button.small { padding: 7px 10px; font-size: 13px; }
input, textarea, select {
  width: 100%;
  background: #191121;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  outline: none;
}
textarea { resize: vertical; min-height: 90px; }
label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
h1, h2, h3 { margin-top: 0; }
p { line-height: 1.65; overflow-wrap: anywhere; }
.hidden { display: none !important; }
.muted { color: var(--muted); font-size: 13px; }
header {
  max-width: 900px;
  margin: auto;
  padding: 24px 18px 10px;
  text-align: center;
}
header h1 { margin-bottom: 6px; color: #e8caff; }
main { max-width: 760px; margin: auto; padding: 12px 16px 60px; }
.card {
  background: rgba(36,25,50,.95);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 17px;
  margin: 14px 0;
  box-shadow: 0 10px 30px #0002;
}
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 150px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.message-content { white-space: pre-wrap; overflow-wrap: anywhere; }
.message-image { display: block; max-width: 100%; max-height: 350px; border-radius: 12px; margin-top: 12px; }
.reply-area {
  margin-top: 14px;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #1b1325;
}
.reply-item {
  border-left: 3px solid #b88de6;
  padding: 10px 12px;
  margin: 10px 0;
  background: #291c37;
  border-radius: 0 10px 10px 0;
}
.reply-item p { white-space: pre-wrap; margin: 7px 0; }
.reply-meta { font-size: 12px; color: var(--muted); }
.status { margin: 12px 0; color: var(--accent); overflow-wrap: anywhere; }
#toast {
  position: fixed;
  left: 50%;
  bottom: 25px;
  transform: translateX(-50%);
  background: #f5e8ff;
  color: #291735;
  border-radius: 12px;
  padding: 12px 16px;
  max-width: 90%;
  z-index: 20;
  box-shadow: 0 6px 25px #0005;
}
footer { text-align: center; padding: 20px; color: var(--muted); font-size: 12px; }
hr { border: 0; border-top: 1px solid var(--border); margin: 15px 0; }
</style>
</head>
<body>
<header>
  <h1>✦ 花花的星海信箱 ✦</h1>
  <p class="muted">把想说的话，寄往星海深处。</p>
</header>

<main>
  <div id="status" class="status" role="status">正在连接星海……</div>

  <section id="authPanel" class="card">
    <h2>主人登录 / 注册</h2>
    <p class="muted">留言箱主人可以登录管理自己的信箱。</p>
    <div class="stack">
      <div>
        <label for="email">邮箱</label>
        <input id="email" type="email" autocomplete="email" placeholder="请输入邮箱">
      </div>
      <div>
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
      </div>
      <div class="row">
        <button id="loginBtn">登录</button>
        <button id="registerBtn" class="secondary">注册</button>
        <button id="logoutBtn" class="secondary hidden">退出登录</button>
      </div>
      <p id="authInfo" class="muted"></p>
    </div>
  </section>

  <section id="ownerPanel" class="card hidden">
    <h2>我的留言箱</h2>
    <div class="stack">
      <div>
        <label for="boxTitle">留言箱名称</label>
        <input id="boxTitle" maxlength="80" placeholder="例如：花花的星海信箱">
      </div>
      <div>
        <label for="boxDescription">留言箱介绍</label>
        <textarea id="boxDescription" maxlength="500" placeholder="写下一段介绍……"></textarea>
      </div>
      <div>
        <label for="boxTheme">主题</label>
        <select id="boxTheme">
          <option value="star">星海紫</option>
          <option value="pink">樱花粉</option>
          <option value="blue">深海蓝</option>
        </select>
      </div>
      <div class="row">
        <button id="createBoxBtn">创建留言箱</button>
        <button id="refreshBoxesBtn" class="secondary">刷新列表</button>
      </div>
    </div>
    <hr>
    <div id="boxesList"></div>
  </section>

  <section id="boxPanel" class="hidden">
    <div class="card">
      <div class="row">
        <div class="grow">
          <h2 id="currentBoxTitle">星海信箱</h2>
          <p id="currentBoxDescription" class="muted"></p>
        </div>
        <button id="backBtn" class="secondary hidden">返回</button>
      </div>
      <div id="shareArea" class="hidden">
        <label>分享链接</label>
        <div class="row">
          <input id="shareUrl" readonly>
          <button id="copyShareBtn">复制</button>
        </div>
        <p class="muted">只有公开的留言箱才能通过分享链接访问。</p>
      </div>
    </div>

    <section id="writePanel" class="card">
      <h3>✉ 写一封留言</h3>
      <div class="stack">
        <div>
          <label for="nickname">昵称（可选）</label>
          <input id="nickname" maxlength="40" placeholder="给自己起个名字">
        </div>
        <label class="row">
          <input id="anonymous" type="checkbox" style="width:auto">
          匿名留言
        </label>
        <div>
          <label for="messageContent">留言内容</label>
          <textarea id="messageContent" maxlength="5000" placeholder="想说的话……"></textarea>
        </div>
        <div>
          <label for="messageImage">图片（可选）</label>
          <input id="messageImage" type="file" accept="image/*">
        </div>
        <button id="sendMessageBtn">发送留言</button>
      </div>
    </section>

    <div class="row">
      <h2 class="grow">星海来信</h2>
      <button id="refreshMessagesBtn" class="secondary">刷新留言</button>
    </div>
    <div id="messagesList"></div>
  </section>
</main>

<footer>愿每一封信，都有人认真读完。</footer>
<div id="toast" class="hidden"></div>

<script>
"use strict";

const SUPABASE_URL = "https://aerhvafsvrfvazhfczwp.supabase.co";
const SUPABASE_KEY = "sb_publishable_cZQ01zJYmuQnM44wepgmow_fgJcNoy-";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;
let currentBox = null;
let publicMode = false;
let toastTimer = null;

const $ = id => document.getElementById(id);

function notify(message, error = false) {
  const el = $("toast");
  el.textContent = message;
  el.style.background = error ? "#ffdce5" : "#f5e8ff";
  el.classList.remove("hidden");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add("hidden"), 3500);
}

function setStatus(message) {
  $("status").textContent = message;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

function formatDate(value) {
  if (!value) return "";
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? "" : d.toLocaleString();
}

function isOwner() {
  return Boolean(user && currentBox &&
    user.id === currentBox.owner_id && !publicMode);
}

function updateAuthUI() {
  $("authInfo").textContent = user ? "已登录：" + user.email : "尚未登录";
  $("logoutBtn").classList.toggle("hidden", !user);
  $("ownerPanel").classList.toggle("hidden", !user);
  $("authPanel").classList.remove("hidden");
  if (user) loadBoxes();
}

async function register() {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || password.length < 6) {
    notify("请输入邮箱和至少 6 位密码。", true);
    return;
  }
  const { error } = await db.auth.signUp({ email, password });
  if (error) return notify(error.message, true);
  notify("注册请求已提交。如果启用了邮箱验证，请先打开验证邮件。");
}

async function login() {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) return notify("请填写邮箱和密码。", true);
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if (error) return notify(error.message, true);
  user = data.user;
  publicMode = false;
  updateAuthUI();
  notify("登录成功。");
  const params = new URLSearchParams(location.search);
  const slug = params.get("box");
  if (slug) await openPublicBox(slug);
}

async function logout() {
  await db.auth.signOut();
  user = null;
  currentBox = null;
  publicMode = false;
  $("boxPanel").classList.add("hidden");
  $("ownerPanel").classList.add("hidden");
  $("logoutBtn").classList.add("hidden");
  $("authInfo").textContent = "尚未登录";
  notify("已退出登录。");
}

async function createBox() {
  if (!user) return notify("请先登录。", true);
  const title = $("boxTitle").value.trim();
  if (!title) return notify("请填写留言箱名称。", true);

  const slug = "star-" + crypto.randomUUID().replaceAll("-", "").slice(0, 16);
  const { data, error } = await db.from("boxes").insert({
    owner_id: user.id,
    slug,
    title,
    description: $("boxDescription").value.trim(),
    theme: $("boxTheme").value,
    is_public: true
  }).select().single();

  if (error) {
    console.error(error);
    return notify("创建失败：" + error.message, true);
  }

  notify("留言箱创建成功。");
  await loadBoxes();
  await openOwnerBox(data);
}

async function loadBoxes() {
  if (!user) return;
  const { data, error } = await db.from("boxes")
    .select("id,owner_id,slug,title,description,theme,is_public,created_at")
    .eq("owner_id", user.id)
    .order("created_at", { ascending: false });

  if (error) {
    console.error(error);
    $("boxesList").textContent = "读取留言箱失败：" + error.message;
    return;
  }

  const root = $("boxesList");
  root.replaceChildren();

  if (!data || !data.length) {
    root.textContent = "你还没有留言箱，可以创建一个。";
    return;
  }

  data.forEach(box => {
    const card = document.createElement("div");
    card.className = "reply-item";

    const title = document.createElement("strong");
    title.textContent = box.title || "未命名留言箱";

    const info = document.createElement("p");
    info.className = "muted";
    info.textContent = box.is_public ? "公开状态：开启" : "公开状态：关闭";

    const open = document.createElement("button");
    open.textContent = "打开并管理";
    open.onclick = () => openOwnerBox(box);

    const share = document.createElement("button");
    share.className = "secondary";
    share.textContent = "复制分享链接";
    share.onclick = async () => {
      const url = location.origin + location.pathname + "?box=" + encodeURIComponent(box.slug);
      try {
        await navigator.clipboard.writeText(url);
        notify("分享链接已复制。");
      } catch {
        prompt("复制以下分享链接：", url);
      }
    };

    const visibility = document.createElement("button");
    visibility.className = "secondary";
    visibility.textContent = box.is_public ? "关闭公开" : "设为公开";
    visibility.onclick = () => setBoxVisibility(box, !box.is_public);

    card.append(title, info, open, document.createTextNode(" "), share,
      document.createTextNode(" "), visibility);
    root.appendChild(card);
  });
}

async function setBoxVisibility(box, nextValue) {
  if (!user || box.owner_id !== user.id) return notify("没有管理权限。", true);

  const { data, error } = await db.from("boxes")
    .update({ is_public: nextValue })
    .eq("id", box.id)
    .eq("owner_id", user.id)
    .select("id,is_public")
    .maybeSingle();

  if (error) return notify("修改失败：" + error.message, true);
  if (!data) return notify("修改失败：数据库没有确认更新，请检查 RLS 策略。", true);

  notify(nextValue ? "留言箱已公开。" : "留言箱已关闭公开。");
  await loadBoxes();

  if (currentBox && currentBox.id === box.id) {
    currentBox.is_public = nextValue;
    updateBoxHeader();
  }
}

async function openOwnerBox(box) {
  currentBox = box;
  publicMode = false;
  $("boxPanel").classList.remove("hidden");
  $("backBtn").classList.remove("hidden");
  $("shareArea").classList.remove("hidden");
  $("writePanel").classList.remove("hidden");
  updateBoxHeader();
  await loadMessages();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function openPublicBox(slug) {
  const { data, error } = await db.from("boxes")
    .select("id,owner_id,slug,title,description,theme,is_public,created_at")
    .eq("slug", slug)
    .eq("is_public", true)
    .maybeSingle();

  if (error || !data) {
    setStatus("无法打开留言箱。请检查留言箱是否公开，以及 Supabase 读取权限。");
    console.error(error);
    return;
  }

  currentBox = data;
  publicMode = true;
  $("boxPanel").classList.remove("hidden");
  $("backBtn").classList.add("hidden");
  $("shareArea").classList.add("hidden");
  $("writePanel").classList.remove("hidden");
  $("ownerPanel").classList.add("hidden");
  updateBoxHeader();
  await loadMessages();
}

function updateBoxHeader() {
  if (!currentBox) return;
  $("currentBoxTitle").textContent = currentBox.title || "星海信箱";
  $("currentBoxDescription").textContent = currentBox.description || "";
  $("shareUrl").value = location.origin + location.pathname +
    "?box=" + encodeURIComponent(currentBox.slug);
}

async function loadMessages() {
  if (!currentBox) return;

  const root = $("messagesList");
  root.replaceChildren();
  const loading = document.createElement("p");
  loading.className = "muted";
  loading.textContent = "正在读取留言……";
  root.appendChild(loading);

  const { data, error } = await db.from("messages")
    .select("id,box_id,nickname,anonymous,content,image_path,created_at")
    .eq("box_id", currentBox.id)
    .order("created_at", { ascending: false });

  root.replaceChildren();

  if (error) {
    console.error(error);
    root.textContent = "读取留言失败：" + error.message;
    return;
  }

  if (!data || !data.length) {
    root.textContent = "这里还没有留言，写下第一封信吧。";
    return;
  }

  for (const message of data) {
    const card = document.createElement("article");
    card.className = "card";

    const heading = document.createElement("div");
    heading.className = "row";

    const author = document.createElement("strong");
    author.className = "grow";
    author.textContent = message.anonymous
      ? "匿名访客"
      : (message.nickname || "星海访客");

    const date = document.createElement("span");
    date.className = "muted";
    date.textContent = formatDate(message.created_at);
    heading.append(author, date);

    const content = document.createElement("p");
    content.className = "message-content";
    content.textContent = message.content || "";

    card.append(heading, content);

    if (message.image_path) {
      const image = document.createElement("img");
      image.className = "message-image";
      image.alt = "留言图片";
      image.loading = "lazy";

      const { data: imageData } = db.storage
        .from("message-images")
        .getPublicUrl(message.image_path);

      image.src = imageData.publicUrl;
      card.appendChild(image);
    }

    const actions = document.createElement("div");
    actions.className = "actions";

    // 关键修复：每条留言都明确创建“查看回复”按钮。
    const toggleReplies = document.createElement("button");
    toggleReplies.className = "secondary";
    toggleReplies.type = "button";
    toggleReplies.textContent = "查看回复";
    actions.appendChild(toggleReplies);

    const replyArea = document.createElement("section");
    replyArea.className = "reply-area hidden";

    const replyList = document.createElement("div");
    replyList.className = "reply-list";

    const replyForm = document.createElement("div");
    replyForm.className = "stack";

    const replyInput = document.createElement("textarea");
    replyInput.maxLength = 3000;
    replyInput.placeholder = "写下你的回复……";

    const sendReplyBtn = document.createElement("button");
    sendReplyBtn.type = "button";
    sendReplyBtn.textContent = "发送回复";

    replyForm.append(replyInput, sendReplyBtn);
    replyArea.append(replyList, document.createElement("hr"), replyForm);
    card.append(actions, replyArea);
    root.appendChild(card);

    toggleReplies.addEventListener("click", async () => {
      const opening = replyArea.classList.contains("hidden");
      replyArea.classList.toggle("hidden", !opening);
      toggleReplies.textContent = opening ? "收起回复" : "查看回复";

      if (opening) {
        await loadReplies(message, replyList);
      }
    });

    sendReplyBtn.addEventListener("click", async () => {
      await sendReply(message, replyInput, replyList, sendReplyBtn);
    });
  }
}

async function loadReplies(message, root) {
  root.replaceChildren();

  const loading = document.createElement("p");
  loading.className = "muted";
  loading.textContent = "正在加载回复……";
  root.appendChild(loading);

  let query = db.from("replies")
    .select("id,box_id,message_id,content,created_at,is_public")
    .eq("box_id", currentBox.id)
    .eq("message_id", message.id)
    .order("created_at", { ascending: true });

  // 访客只请求公开回复；主人可以请求该留言的全部回复。
  if (!isOwner()) query = query.eq("is_public", true);

  const { data, error } = await query;
  root.replaceChildren();

  if (error) {
    console.error(error);
    const err = document.createElement("p");
    err.className = "muted";
    err.textContent = "读取回复失败：" + error.message +
      "。请检查 replies 表的 SELECT RLS 策略。";
    root.appendChild(err);
    return;
  }

  if (!data || !data.length) {
    const empty = document.createElement("p");
    empty.className = "muted";
    empty.textContent = "还没有公开回复。你可以写下第一条回复。";
    root.appendChild(empty);
    return;
  }

  data.forEach(reply => {
    const item = document.createElement("div");
    item.className = "reply-item";

    const text = document.createElement("p");
    text.textContent = reply.content || "";

    const meta = document.createElement("div");
    meta.className = "reply-meta";
    meta.textContent = formatDate(reply.created_at) +
      (isOwner() && reply.is_public === false ? " · 仅主人可见" : "");

    item.append(text, meta);

    if (isOwner()) {
      const controls = document.createElement("div");
      controls.className = "actions";

      const visibility = document.createElement("button");
      visibility.type = "button";
      visibility.className = "secondary small";
      visibility.textContent = reply.is_public ? "设为隐藏" : "设为公开";
      visibility.onclick = () => toggleReplyVisibility(reply, message, root);

      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "danger small";
      remove.textContent = "删除回复";
      remove.onclick = () => deleteReply(reply, message, root);

      controls.append(visibility, remove);
      item.appendChild(controls);
    }

    root.appendChild(item);
  });
}

async function sendReply(message, input, root, button) {
  const content = input.value.trim();
  if (!content) return notify("请先填写回复内容。", true);
  if (!currentBox) return notify("请先打开留言箱。", true);

  button.disabled = true;

  // 新回复默认公开。是否能写入仍由 Supabase RLS 决定。
  const { error } = await db.from("replies").insert({
    box_id: currentBox.id,
    message_id: message.id,
    content,
    is_public: true
  });

  button.disabled = false;

  if (error) {
    console.error(error);
    notify("发送回复失败：" + error.message, true);
    return;
  }

  input.value = "";
  notify("回复已发送。");
  await loadReplies(message, root);
}

async function toggleReplyVisibility(reply, message, root) {
  if (!isOwner()) return notify("只有留言箱主人可以修改回复。", true);

  const nextValue = !reply.is_public;
  const { data, error } = await db.from("replies")
    .update({ is_public: nextValue })
    .eq("id", reply.id)
    .eq("box_id", currentBox.id)
    .select("id,is_public")
    .maybeSingle();

  if (error) {
    console.error(error);
    return notify("修改失败：" + error.message +
      "。请检查 replies 的 UPDATE RLS 策略。", true);
  }
  if (!data) {
    return notify("数据库没有确认修改。请检查主人 UPDATE 策略是否允许操作自己的留言箱。", true);
  }

  notify(nextValue ? "回复已公开。" : "回复已隐藏。");
  await loadReplies(message, root);
}

async function deleteReply(reply, message, root) {
  if (!isOwner()) return notify("只有留言箱主人可以删除回复。", true);
  if (!confirm("确定删除这条回复吗？删除后无法恢复。")) return;

  const { data, error } = await db.from("replies")
    .delete()
    .eq("id", reply.id)
    .eq("box_id", currentBox.id)
    .select("id");

  if (error) {
    console.error(error);
    return notify("删除失败：" + error.message +
      "。请检查 replies 的 DELETE RLS 策略。", true);
  }
  if (!data || !data.length) {
    return notify("没有删除任何记录。请检查主人 DELETE RLS 策略。", true);
  }

  notify("回复已删除。");
  await loadReplies(message, root);
}

async function sendMessage() {
  if (!currentBox) return notify("请先打开留言箱。", true);
  if (!currentBox.is_public && !isOwner()) {
    return notify("此留言箱暂未开放。", true);
  }

  const content = $("messageContent").value.trim();
  const file = $("messageImage").files[0];

  if (!content && !file) return notify("请填写留言或选择图片。", true);
  if (file && !file.type.startsWith("image/")) {
    return notify("请选择图片文件。", true);
  }
  if (file && file.size > 5 * 1024 * 1024) {
    return notify("图片不能超过 5 MB。", true);
  }

  let imagePath = null;

  if (file) {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    imagePath = currentBox.id + "/" + crypto.randomUUID() + "-" + safeName;

    const { error: uploadError } = await db.storage
      .from("message-images")
      .upload(imagePath, file, { upsert: false });

    if (uploadError) {
      console.error(uploadError);
      return notify("图片上传失败：" + uploadError.message, true);
    }
  }

  const { error } = await db.from("messages").insert({
    box_id: currentBox.id,
    nickname: $("nickname").value.trim() || null,
    anonymous: $("anonymous").checked,
    content,
    image_path: imagePath
  });

  if (error) {
    console.error(error);
    return notify("发送留言失败：" + error.message, true);
  }

  $("messageContent").value = "";
  $("messageImage").value = "";
  notify("留言已发送。");
  await loadMessages();
}

async function copyShare() {
  if (!currentBox) return;
  const value = $("shareUrl").value;
  try {
    await navigator.clipboard.writeText(value);
    notify("分享链接已复制。");
  } catch {
    prompt("请复制分享链接：", value);
  }
}

function goBack() {
  currentBox = null;
  publicMode = false;
  $("boxPanel").classList.add("hidden");
  if (user) $("ownerPanel").classList.remove("hidden");
}

$("loginBtn").addEventListener("click", login);
$("registerBtn").addEventListener("click", register);
$("logoutBtn").addEventListener("click", logout);
$("createBoxBtn").addEventListener("click", createBox);
$("refreshBoxesBtn").addEventListener("click", loadBoxes);
$("refreshMessagesBtn").addEventListener("click", loadMessages);
$("sendMessageBtn").addEventListener("click", sendMessage);
$("copyShareBtn").addEventListener("click", copyShare);
$("backBtn").addEventListener("click", goBack);

async function init() {
  if (!window.supabase) {
    setStatus("Supabase SDK 加载失败，请检查网络。");
    return;
  }

  const { data, error } = await db.auth.getSession();
  if (error) console.error(error);

  user = data?.session?.user || null;
  updateAuthUI();

  db.auth.onAuthStateChange((_event, session) => {
    user = session?.user || null;
    updateAuthUI();
  });

  const slug = new URLSearchParams(location.search).get("box");
  if (slug) {
    await openPublicBox(slug);
  } else {
    setStatus(user ? "已连接。请选择或创建留言箱。" : "欢迎来到花花的星海信箱。");
  }
}

init();
</script>
